spring.application.name=nexion-backend

# importa a senha do banco
spring.config.import=optional:classpath:application-secrets.properties

# Banco MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/nexion?createDatabaseIfNotExist=true   
spring.datasource.username=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Envio de email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent

app.frontend.url=http://localhost:3000

jwt.expiration=86400000

server.port=8080